    <style>
        :root {
            --primary: #ff0055;
            --secondary: #1e293b;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
        }
        .header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #ff005533, transparent);
        }
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }
        .status {
            display: inline-block;
            background: #22c55e;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        h1 { font-size: 24px; margin: 15px 0 5px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        
        .gallery-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
        }
        .video-card {
            background: var(--glass);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
            text-decoration: none;
            color: white;
            position: relative;
        }
        .video-card:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }
        .thumbnail {
            width: 100%;
            aspect-ratio: 9/16;
            background: #1e293b;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .thumb-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
        }

        .play-btn {
            position: absolute;
            background: var(--primary);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.6);
            z-index: 2;
        }
        .play-triangle {
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-left: 14px solid white;
            border-bottom: 8px solid transparent;
            margin-left: 4px;
        }

        .video-info {
            padding: 10px;
            font-size: 13px;
            text-align: center;
            background: rgba(0,0,0,0.8);
            position: relative;
            z-index: 2;
        }
        @media (max-width: 480px) {
            .gallery-container { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
        .footer-cta { text-align: center; padding: 40px 20px; background: var(--secondary); margin-top: 30px; }
        .main-btn {
            background: var(--primary); color: white; padding: 15px 40px; border-radius: 30px;
            text-decoration: none; font-weight: bold; font-size: 18px; box-shadow: 0 5px 20px rgba(255, 0, 85, 0.4);
            display: inline-block;
        }
    </style>
</head>
