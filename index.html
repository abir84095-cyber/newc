<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Local Match</title>
    <style>
        /* ক্লিন এবং ফাস্ট লোডিং সিএসএস */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #ff4d6d 0%, #ff7eb3 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: #ffffff;
            width: 90%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 40px 25px;
            text-align: center;
        }
        h1 { font-size: 26px; margin-bottom: 12px; color: #1e293b; font-weight: 800; }
        p { font-size: 15px; margin-bottom: 30px; color: #475569; line-height: 1.5; }
        
        /* স্টেপ অ্যানিমেশন */
        .step { display: none; }
        .step.active { display: block; animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        /* বাটন ডিজাইন */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: #ff0055;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.3);
        }
        .btn:hover { background: #e6004c; transform: translateY(-2px); }
        .btn-outline {
            background: transparent;
            color: #ff0055;
            border: 2px solid #ff0055;
            box-shadow: none;
        }
        .btn-outline:hover { background: #ff0055; color: white; }
    </style>
</head>
